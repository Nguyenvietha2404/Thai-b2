<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Học từ vựng tiếng Thái</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--f:'Noto Sans Thai Looped','Sarabun','TH Sarabun New',Tahoma,system-ui,sans-serif;--bg:#f6f5f1;--cd:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e2e0d8;--ac:#b4412b;--as:#f7e3de;--ok:#2d7a4b;--no:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#151514;--cd:#201f1d;--tx:#eeece6;--mu:#a09e96;--bd:#35332f;--ac:#e8806a;--as:#3a2420;--ok:#6fcf97;--no:#f2877f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--f)}
.th{font-family:var(--f)}.mu{color:var(--mu)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--cd)}
header h1{font-size:18px;margin:0 auto 0 0}
button,select,input{font:inherit;color:inherit}
button{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}button.pri,.tabs .on{background:var(--ac);border-color:var(--ac);color:#fff}
button:disabled{cursor:default;opacity:.9}
.wrap{display:grid;grid-template-columns:250px 1fr;gap:16px;padding:16px;max-width:1100px;margin:auto}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
#side{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:8px;align-self:start}
.di{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer}
.di:hover{background:var(--as)}.di.on{background:var(--as);font-weight:600;color:var(--ac)}.di b{font-weight:400;color:var(--mu)}
#main{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:16px;min-width:0}
.hd h2{margin:0 0 8px;font-size:20px}.hd small{color:var(--mu);font-weight:400;font-size:14px}
.bt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.row{display:grid;grid-template-columns:1fr 1.4fr auto;gap:12px;padding:10px 0;border-top:1px solid var(--bd);align-items:start}
@media(max-width:600px){.row{grid-template-columns:1fr auto}.row>:nth-child(2){grid-column:1/3;order:3}}
.big{font-size:22px}.sm{font-size:15px}.ic{border:0;background:none;padding:2px 6px}
.fc{min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;padding:24px;border:2px solid var(--bd);border-radius:16px;cursor:pointer;background:var(--bg)}
.hu{font-size:52px;line-height:1.3}.hv{font-size:26px}.tag{background:var(--as);color:var(--ac);padding:2px 8px;border-radius:99px}
.ctl{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:12px;flex-wrap:wrap}
.box{display:grid;gap:12px;max-width:380px}.box label{display:grid;gap:4px}select,input{padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--cd)}
.op{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px}.op.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}.op.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,transparent)}
.chip{font-size:22px;min-width:44px}.chip.on{background:var(--as);border-color:var(--ac)}
.sv{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin:12px 0}.sv>div{text-align:center}
#cv{width:300px;max-width:100%;border:1px dashed var(--bd);border-radius:12px;touch-action:none;cursor:crosshair}
.gl{fill:var(--ac);fill-opacity:0;stroke:var(--ac);stroke-width:2;stroke-dasharray:900;stroke-dashoffset:900;animation:dr 3.2s ease forwards}
@keyframes dr{70%{stroke-dashoffset:0;fill-opacity:0}100%{stroke-dashoffset:0;fill-opacity:1}}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--cd);color:var(--tx);width:min(440px,92vw)}dialog::backdrop{background:#0006}
dialog label{display:grid;gap:3px;margin:8px 0}dialog .bt{justify-content:flex-end;margin-top:14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s}#toast.show{opacity:1}
</style></head><body>

function parseRows(rows){const T=/[\u0E00-\u0E7F]/,sp=s=>{const m=s.match(/^(.*?)\s*\(([^()]*)\)\s*$/s);return m?[m[1],m[2]]:[s,'']},un=s=>s.replace(/^\(|\)$/g,'').trim();
 let m=null,out=[],last=null;
 for(const r of rows){const c=r.map(v=>String(v??'').trim()),h=c.map(v=>v.toLowerCase()),fi=re=>h.findIndex(v=>re.test(v));
  if(fi(/câu hỏi/)>=0){m={k:'d',q:fi(/câu hỏi/),a:fi(/trả lời/),n:fi(/chủ đề/)};continue}
  if(fi(/tiếng thái/)>=0&&fi(/tiếng việt|nghĩa/)>=0){m={k:'v',th:fi(/tiếng thái/),rom:fi(/phiên/),vi:fi(/tiếng việt|nghĩa/),ex:fi(/ví dụ/)};continue}
  if(!m)continue;
  if(m.k=='v'){if(!T.test(c[m.th]))continue;const[e,v]=m.ex>=0?sp(c[m.ex]):['',''];out.push({id:uid(),grp:'v',th:c[m.th],rom:m.rom>=0?c[m.rom]:'',vi:c[m.vi],ex:e,exv:v,note:''})}
